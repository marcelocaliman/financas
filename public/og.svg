<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="62%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0b0d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Marca -->
  <g transform="translate(80,72)">
    <rect width="60" height="60" rx="17" fill="#3ecf8e"/>
    <g transform="scale(0.1171875)" fill="none" stroke="#07140d" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 198 H360"/><path d="M308 146 L360 198 L308 250"/>
      <path d="M362 314 H152"/><path d="M204 262 L152 314 L204 366"/>
    </g>
    <text x="78" y="40" font-size="31" font-weight="600" fill="#f3f4f6" letter-spacing="-0.5">Nossas Finanças</text>
  </g>

  <!-- Eyebrow -->
  <text x="82" y="232" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="19" font-weight="600" fill="#3ecf8e" letter-spacing="3.4">PATRIMÔNIO MULTIMOEDA · PRIVADO · CROSS-BORDER</text>

  <!-- Headline -->
  <text x="79" y="318" font-size="74" font-weight="600" fill="#f3f4f6" letter-spacing="-3">Sua vida financeira</text>
  <text x="79" y="402" font-size="74" font-weight="600" letter-spacing="-3"><tspan fill="#f3f4f6">entre países, </tspan><tspan fill="#3ecf8e">só sua.</tspan></text>

  <!-- Subtítulo -->
  <text x="82" y="466" font-size="25" fill="#9ca2ac">Criptografia ponta a ponta — o servidor nunca vê os seus números.</text>

  <!-- Selos -->
  <g font-size="20" fill="#9ca2ac">
    <circle cx="86" cy="540" r="4.5" fill="#3ecf8e"/><text x="100" y="547">Criptografia E2EE</text>
    <circle cx="300" cy="540" r="4.5" fill="#3ecf8e"/><text x="314" y="547">BRL · EUR · USD · GBP</text>
    <circle cx="560" cy="540" r="4.5" fill="#3ecf8e"/><text x="574" y="547">Local-first · offline</text>
  </g>

  <!-- Mini-gráfico de tendência (canto inferior direito) -->
  <g transform="translate(820,360)">
    <path d="M0,168 L40,156 L80,160 L120,128 L160,134 L200,96 L240,84 L280,52 L300,40 L300,200 L0,200 Z" fill="url(#area)"/>
    <path d="M0,168 L40,156 L80,160 L120,128 L160,134 L200,96 L240,84 L280,52 L300,40" fill="none" stroke="#3ecf8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1118" y="582" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="19" fill="#5f646c">nossasfinancas.com.br</text>
</svg>
