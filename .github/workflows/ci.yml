name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando um novo é empurrado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Gates DUROS — barram o merge.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        env:
          # env.ts é permissivo fora de production; o núcleo é mockado nos testes.
          NODE_ENV: test

      # Lint REPORTA mas ainda não barra: há ~31 erros pré-existentes (hooks
      # condicionais, entidades não-escapadas) que serão zerados numa passada
      # dedicada. Quando o lint estiver verde, remover o `continue-on-error`
      # pra torná-lo um gate duro (ver ROADMAP, dimensão Observabilidade).
      - name: Lint (report-only)
        run: pnpm run lint
        continue-on-error: true
